<style>
:root{
  --bg:#fff9fb;--panel:#ffffffcc;--panel-solid:#fff;--text:#17181c;--muted:#6f7280;
  --pink:#ff4f96;--pink-2:#ff8fbd;--pink-tint:#fde8f2;--pink-dark:#ef337c;--mint:#45cbb5;--mint-2:#9be4d8;--purple:#9a65e8;
  --blue:#4d9af5;--yellow:#ffb325;--orange:#ff8a3d;--red:#ff5c69;--border:#eee8ee;
  --font-body:'Plus Jakarta Sans';
  --shadow:0 12px 35px rgba(125,84,108,.10);--radius:20px;
}
body.theme-blossom{--pink:#ff4f96;--pink-2:#ff8fbd;--pink-tint:#fde8f2;--pink-dark:#ef337c;--purple:#9a65e8}
body.theme-ocean{--pink:#2f7fe0;--pink-2:#6fa8ea;--pink-tint:#e3f0fd;--pink-dark:#1f6fd0;--purple:#22b8cf}
body.theme-emerald{--pink:#0ea87e;--pink-2:#4fc79f;--pink-tint:#e1f7ef;--pink-dark:#0a8f68;--purple:#45cbb5}
body.theme-sunset{--pink:#ff7a3d;--pink-2:#ffa06a;--pink-tint:#fff0e2;--pink-dark:#e0651f;--purple:#ffb325}
body.theme-berry{--pink:#c0396e;--pink-2:#d1608c;--pink-tint:#f7e6ee;--pink-dark:#a82c5c;--purple:#8449d8}
body.theme-midnight{--pink:#4d5b9e;--pink-2:#7482c2;--pink-tint:#e8eaf7;--pink-dark:#3c4880;--purple:#6b7fd6}
body.font-modern{--font-body:'Plus Jakarta Sans'}
body.font-classic{--font-body:'Inter'}
body.font-rounded{--font-body:'Poppins'}
body.font-geometric{--font-body:'Outfit'}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.clickable-row,[onclick]{-webkit-tap-highlight-color:transparent}
.icon-swatch,.theme-swatch,.font-option{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font-body),ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:
  radial-gradient(circle at 8% 5%,#fff0e5 0,transparent 24%),
  radial-gradient(circle at 68% 0%,#fff0f6 0,transparent 28%),
  radial-gradient(circle at 100% 10%,#edf8ff 0,transparent 24%),
  var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:225px 1fr;gap:16px;padding:16px;min-height:100vh}
.sidebar{background:#fffdfdcc;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);backdrop-filter:blur(16px);z-index:70}
.sidebar-header{display:flex;align-items:flex-start;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 0 20px;flex:1;min-width:0}
.brand-logo-img{height:38px;width:auto;max-width:100%;object-fit:contain;display:block}
.brand-logo-dark{display:none}
body.dark .brand-logo-light{display:none}
body.dark .brand-logo-dark{display:block;height:44px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 8px 16px rgba(0,0,0,.22)}
.brand-mark .icon{width:17px;height:17px}
.brand-text{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.3px;color:var(--text);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.brand-pro{font-size:9.5px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;padding:3px 6px;border-radius:6px;letter-spacing:.6px;line-height:1;flex:none}
.demo-strip{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #ffe0a3;background:#fff4df;color:#a35d00;font-size:11.5px;font-weight:700;padding:10px 12px;border-radius:12px;margin:0 0 14px;cursor:pointer;font-family:inherit;text-align:left}
.demo-strip .icon{width:14px;height:14px;flex:none}
.demo-strip:hover{background:#ffe9c2}
body.dark .demo-strip{background:#3a2f18;color:#ffcf87;border-color:#4a3d22}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px;margin-right:-2px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;color:#222;cursor:pointer;position:relative;transition:background .15s;flex:none}.nav button.active{background:var(--pink-tint);color:var(--pink-dark);font-weight:700}.nav button.active::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:4px;background:linear-gradient(180deg,var(--pink),var(--purple))}.nav button:hover{background:#faf6f9}.ico{width:22px;text-align:center;font-size:19px}
.nav-section{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:16px 14px 6px}.nav-section:first-child{padding-top:2px}
.sidebar-close{display:none}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(20,10,20,.5);z-index:65;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sidebar-backdrop.show{display:block;opacity:1}
.upgrade{margin-top:auto;flex:none;background:linear-gradient(160deg,#fff1f7,#fff8ef);border-radius:16px;padding:14px;text-align:center;font-size:12px}
.tip-icon{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--pink);display:grid;place-items:center;margin:0 auto 8px;box-shadow:0 4px 10px rgba(255,79,150,.15)}
.tip-icon .icon{width:17px;height:17px}
.upgrade b{font-family:'Poppins',sans-serif;font-size:12.5px}
.upgrade p{margin:6px 0 0;line-height:1.5;color:var(--muted)}
.tip-btn{border:0;flex:1;color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-2));padding:8px 6px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tip-btn .icon{width:11px;height:11px}
.tip-btn-outline{background:#fff;color:var(--pink);border:1px solid var(--pink-tint)}
body.dark .upgrade{background:linear-gradient(160deg,#2b2530,#241f28)}
body.dark .tip-icon{background:#24212b}
body.dark .tip-btn-outline{background:transparent;border-color:#3d3742}
.main{min-width:0}.topbar{background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:18px;backdrop-filter:blur(16px);position:relative;z-index:20}
.menu{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:20px}
@media(min-width:851px){.menu{display:none}}
.hello{flex:1;min-width:64px}.hello h1{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}.hello p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:10px;align-items:center}.pill,.round{border:1px solid var(--border);background:#fff;border-radius:12px;height:42px;box-shadow:0 5px 18px rgba(100,75,90,.06);cursor:pointer;transition:transform .15s,box-shadow .15s}.pill:hover,.round:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(100,75,90,.12)}.pill{padding:0 14px;white-space:nowrap}.round{width:42px}.round:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.round:disabled:hover{transform:none;box-shadow:none}
.theme-toggle{width:56px;height:32px;flex:none;padding:0;border-radius:20px;border:1px solid var(--border);background:linear-gradient(90deg,#ffe8c2,#d9b3f5);position:relative;cursor:pointer;box-shadow:0 5px 18px rgba(100,75,90,.08),inset 0 1px 2px rgba(255,255,255,.4);transition:transform .15s,box-shadow .15s}
.theme-toggle:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(100,75,90,.14),inset 0 1px 2px rgba(255,255,255,.4)}
.theme-toggle-thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.34,1.35,.64,1)}
body.dark .theme-toggle-thumb{transform:translateX(24px)}
.theme-toggle-thumb .icon{grid-area:1/1;width:14px;height:14px;transition:opacity .25s,transform .35s}
.theme-toggle-thumb .icon-sun{color:#ffb325;opacity:1;transform:scale(1) rotate(0)}
.theme-toggle-thumb .icon-moon{color:#8a6fd6;opacity:0;transform:scale(.4) rotate(-40deg)}
body.dark .theme-toggle-thumb .icon-sun{opacity:0;transform:scale(.4) rotate(40deg)}
body.dark .theme-toggle-thumb .icon-moon{opacity:1;transform:scale(1) rotate(0)}

.more-wrap{position:relative}

.mobile-only-more-item{display:none;gap:8px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.more-item-half{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;border:1px solid var(--border);background:transparent;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text)}
.more-item-half:disabled{opacity:.35;cursor:not-allowed}
.more-item-half .icon{width:15px;height:15px}
.more-item-mobile-only{display:none}
@media(max-width:560px){.more-item-mobile-only{display:flex}}
.more-item:hover{background:#faf3f6}
.more-item .more-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.more-item .more-ic .icon{width:15px;height:15px}
.more-divider{height:1px;background:var(--border);margin:6px 4px}
body.dark .more-dropdown{background:#24212b}

.profile-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;display:grid;place-items:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;flex:none}

.field input[type=file]{padding:8px;font-size:12px;cursor:pointer}
.amount-input-wrap{position:relative}

.calc-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--pink-tint);color:var(--pink-dark);display:grid;place-items:center;cursor:pointer;padding:0}
.calc-btn .icon{width:15px;height:15px}
.calc-btn:hover{background:var(--pink);color:#fff}
.calc-display{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:20px 16px;text-align:right;font-family:'Poppins',sans-serif;font-size:32px;font-weight:700;margin:0 0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.calc-key{height:54px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--text);display:grid;place-items:center;transition:background .15s}

.calc-key.calc-op{background:var(--pink-tint);color:var(--pink-dark);font-size:20px}
.calc-key.calc-op.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 12px rgba(255,79,150,.35)}

body.dark .field input,body.dark .field select,body.dark .filters-row input,body.dark .filters-row select,body.dark .btn-secondary,body.dark .icon-btn{background:#2b2732;color:#fff;border-color:#3d3742}

.month-switcher{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px 6px;box-shadow:0 5px 18px rgba(100,75,90,.06)}

.month-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.month-pick-cell{padding:14px 6px;border-radius:12px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--text);transition:background .15s,transform .15s}
.month-pick-cell:hover{background:var(--pink-tint);transform:translateY(-1px)}

body.dark .month-switcher{background:#24212b}
body.dark .today-chip{background:rgba(255,255,255,.07);border-color:var(--pink);color:var(--pink)}

.settings-subhead{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
.activation-box{background:linear-gradient(135deg,var(--pink-tint),#fff8ef);border:1px solid var(--pink-tint);border-radius:16px;padding:16px;margin-bottom:22px}
body.dark .activation-box{background:linear-gradient(135deg,#2b2530,#241f28);border-color:#3d3742}

.activation-head{display:flex;align-items:flex-start;gap:12px}

body.dark .lifetime-note{background:#173229;border-color:#1f4536;color:#7fe0c0}
.caution-note{display:flex;align-items:flex-start;gap:8px;background:#fff4df;border:1px solid #ffe4b3;border-radius:10px;padding:9px 11px;margin-top:12px;font-size:11.5px;line-height:1.5;color:#a35d00}

body.dark .caution-note{background:#3a2f18;border-color:#4a3a1f;color:#ffcf87}

::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e9dde3;border-radius:20px}
body.dark ::-webkit-scrollbar-thumb{background:#3a3441}
*{scrollbar-width:thin;scrollbar-color:#e9dde3 transparent}

#viewRoot>section{animation:fadeInUp .35s ease}
.btn-primary,.manage{transition:transform .15s,box-shadow .15s}

/* print */
@media print{
  body{background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sidebar,.sidebar-backdrop,.topbar,.modal-overlay,.toast-wrap,.upgrade,.backup-reminder,.today-alert,
  .btn-primary,.btn-secondary,.icon-btn,.manage,.range-switcher,.month-switcher,.filters-row,
  .field input[type=file],#backBtn,.recur-badge,.link{display:none !important}
  .app{display:block;padding:0}
  .main{width:100%}
  #viewRoot{margin:0}
  .panel,.card{box-shadow:none !important;border:1px solid #ddd !important;break-inside:avoid;backdrop-filter:none !important;background:#fff !important}
  .panel-title h2{color:#111 !important;-webkit-text-fill-color:#111 !important;background:none !important}
  .cards{grid-template-columns:repeat(3,1fr) !important}
  .grid{grid-template-columns:1fr 1fr !important}
  .print-header{display:block !important;margin-bottom:16px;font-family:'Poppins',sans-serif;font-weight:800;font-size:18px}
  .print-header span{display:block;font-size:11px;font-weight:500;color:#888;margin-top:2px}
}
.print-header{display:none}

<script>
/* ---------- utilities ---------- */
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function daysAgo(n){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return isoDate(d); }
function daysFromNow(n){ return daysAgo(-n); }
function todayISO(){ return daysAgo(0); }
function daysBetween(a,b){ const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00'); return Math.round((db-da)/86400000); }
function esc(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function highlightMatch(text, q){
  text = String(text==null?'':text);
  if(!q) return esc(text);
  const lowerText = text.toLowerCase(), lowerQ = q.toLowerCase();
  let result='', pos=0, idx;
  while((idx = lowerText.indexOf(lowerQ, pos)) !== -1){
    result += esc(text.slice(pos, idx));
    result += '<mark class="search-hl">'+esc(text.slice(idx, idx+q.length))+'</mark>';
    pos = idx + q.length;
  }
  result += esc(text.slice(pos));
  return result;
}
function fmt(n){ n = isNaN(n)?0:n; const c = state.settings.currency||'$'; const neg = n<0; const val = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'-':'')+c+val; }
function fmtShort(n){ if(n>=1000) return '$'+(n/1000).toFixed(1)+'k'; return '$'+Math.round(n); }
function fmtDateShort(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateMed(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function iconSvg(name){ return '<svg class="icon" aria-hidden="true"><use href="#'+name+'"></use></svg>'; }
function downloadFile(filename, content, mime){ const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function emptyState(msg){ return '<div class="empty-state">'+iconSvg('i-file')+esc(msg)+'</div>'; }

/* ---------- categories ---------- */
const CATS = {
  Housing:{icon:'i-home', color:'#ff4f96', cls:'pink', bg:'bg-pink'},
  Food:{icon:'i-utensils', color:'#9a65e8', cls:'purple', bg:'bg-purple'},
  Transportation:{icon:'i-car', color:'#ffb325', cls:'yellow', bg:'bg-yellow'},
  Utilities:{icon:'i-bulb', color:'#45cbb5', cls:'mint', bg:'bg-mint'},

  Health:{icon:'i-heart', color:'#b98fe7', cls:'purple', bg:'bg-purple'},
  Other:{icon:'i-file', color:'#d9bdf7', cls:'blue', bg:'bg-blue'},
  Income:{icon:'i-wallet', color:'#12ad8e', cls:'mint', bg:'bg-mint'}
};
const CAT_NAMES = Object.keys(CATS).filter(function(c){ return c!=='Income'; });
const ICON_PALETTE = [
  {icon:'i-home', color:'#ff4f96', name:'Home'},
  {icon:'i-utensils', color:'#9a65e8', name:'Food'},
  {icon:'i-car', color:'#ffb325', name:'Transport'},
  {icon:'i-bulb', color:'#45cbb5', name:'Utilities'},
  {icon:'i-gamepad', color:'#4d9af5', name:'Fun'},
  {icon:'i-heart', color:'#e0629a', name:'Health'},
  {icon:'i-wallet', color:'#12ad8e', name:'Money'},
  {icon:'i-piggy', color:'#f0a500', name:'Savings'},

function saveState(){
  if(lastSnapshot!==null){
    undoStack.push(lastSnapshot);
    if(undoStack.length>UNDO_LIMIT) undoStack.shift();
    redoStack = [];
  }
  const json = JSON.stringify(state);
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){ toast('Could not save data in this browser','error'); }

}

  if(!undoStack.length) return;
  redoStack.push(lastSnapshot);
  const prev = undoStack.pop();
  state = JSON.parse(prev);
  lastSnapshot = prev;
  try{ localStorage.setItem(STORAGE_KEY, prev); }catch(e){}
  closeModal();

  updateUndoRedoButtons();
  toast('Undone');
}

  if(!redoStack.length) return;
  undoStack.push(lastSnapshot);

function monthlyBreakdown(year){

    state.transactions.forEach(function(t){ if(t.date.indexOf(prefix)===0){ if(t.type==='income') inc+=t.amount; else exp+=Math.abs(t.amount); } });
    rows.push({m:m, inc:inc, exp:exp});
  }
  return rows;

  const activeMonths = rows.filter(function(r){return r.inc>0||r.exp>0;}).length;
  return {inc:inc, exp:exp, net:inc-exp, avgExpense: activeMonths? exp/activeMonths : 0, rows:rows};
}

function buildYearlyChart(year){

  let bars='';
  rows.forEach(function(r,i){
    const gx = padL + i*groupW + groupW/2;
    const incH = maxV? (r.inc/maxV)*chartH : 0;
    const expH = maxV? (r.exp/maxV)*chartH : 0;
    const incLabel = MONTH_SHORT[i]+' '+year+' Income: '+fmt(r.inc);
    const expLabel = MONTH_SHORT[i]+' '+year+' Expenses: '+fmt(r.exp);
    bars += '<rect x="'+(gx-barW-1).toFixed(1)+'" y="'+(padT+chartH-incH).toFixed(1)+'" width="'+barW+'" height="'+Math.max(incH,1.5).toFixed(1)+'" rx="2.5" fill="#45cbb5" class="chart-dot" onclick="toast(this.getAttribute(&quot;data-label&quot;))" data-label="'+esc(incLabel)+'"><title>'+incLabel+'</title></rect>';
    bars += '<rect x="'+(gx+1).toFixed(1)+'" y="'+(padT+chartH-expH).toFixed(1)+'" width="'+barW+'" height="'+Math.max(expH,1.5).toFixed(1)+'" rx="2.5" fill="#ff4f96" class="chart-dot" onclick="toast(this.getAttribute(&quot;data-label&quot;))" data-label="'+esc(expLabel)+'"><title>'+expLabel+'</title></rect>';
  });
  const xLabels = rows.map(function(r,i){

  return '<div class="chart-legend"><span><i class="dot" style="background:#45cbb5"></i>Income</span><span><i class="dot" style="background:#ff4f96"></i>Expenses</span></div>'+
  '<div class="line-chart"><div class="y-labels"><span>'+fmtShort(maxV)+'</span><span>'+fmtShort(maxV*0.75)+'</span><span>'+fmtShort(maxV*0.5)+'</span><span>'+fmtShort(maxV*0.25)+'</span><span>$0</span></div>'+
  '<div class="chart-area" title="Tap a bar to see the exact amount for that month"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+bars+'</svg></div>'+
  '<div class="x-labels" style="position:absolute">'+xLabels+'</div></div>';

function buildLineChart(){
  if(chartRange==='today') return buildTodayView();
  const N = chartRange;
  const fullDates=[], inc=[], exp=[];
  for(let i=N-1;i>=0;i--){
    const iso=daysAgo(i); fullDates.push(iso);
    let di=0, de=0;
    state.transactions.forEach(function(t){ if(t.date===iso){ if(t.type==='income') di+=t.amount; else de+=Math.abs(t.amount); } });
    inc.push(di); exp.push(de);
  }
  const maxV = Math.max(50, Math.max.apply(null, inc), Math.max.apply(null, exp));
  const W=420,H=170,padL=10,padR=10,padT=8,padB=8;
  const stepX = N>1 ? (W-padL-padR)/(N-1) : 0;
  function coords(arr){ return arr.map(function(v,i){ const x=padL+i*stepX; const y=H-padB-(v/maxV)*(H-padT-padB); return {x:x,y:y,v:v}; }); }
  function pts(coordArr){ return coordArr.map(function(c){ return c.x.toFixed(1)+','+c.y.toFixed(1); }).join(' '); }
  const incC=coords(inc), expC=coords(exp);
  const incPts=pts(incC), expPts=pts(expC);
  const incArea=padL+','+(H-padB)+' '+incPts+' '+(W-padR)+','+(H-padB);
  const expArea=padL+','+(H-padB)+' '+expPts+' '+(W-padR)+','+(H-padB);
  const dotR = N<=7? 4 : (N<=30? 2.6 : 1.6);
  function dots(coordArr, color){
    return coordArr.map(function(c,i){
      const label = fmtDateShort(fullDates[i])+': '+fmt(c.v);
      const tap = 'onclick="toast(this.getAttribute(&quot;data-label&quot;))" data-label="'+esc(label)+'"';
      return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="12" fill="transparent" class="chart-dot-hit" '+tap+'></circle>'+
      '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+dotR+'" fill="'+color+'" stroke="#fff" stroke-width="1.2" class="chart-dot" '+tap+'><title>'+label+'</title></circle>';
    }).join('');
  }
  const labelCount = Math.min(N, 6);
  const labelIdx = [];
  for(let k=0;k<labelCount;k++){ labelIdx.push(Math.round(k*(N-1)/(Math.max(labelCount-1,1)))); }
  const xLabelsHtml = labelIdx.map(function(idx){
    const pct = N>1? (idx/(N-1))*100 : 50;
    return '<span style="position:absolute;left:'+pct.toFixed(1)+'%;transform:translateX(-'+pct.toFixed(0)+'%)">'+fmtDateMed(fullDates[idx])+'</span>';
  }).join('');
  return '<div class="chart-legend"><span><i class="dot" style="background:#45cbb5"></i>Income</span><span><i class="dot" style="background:#ff4f96"></i>Expenses</span></div>'+
  '<div class="line-chart"><div class="y-labels"><span>'+fmtShort(maxV)+'</span><span>'+fmtShort(maxV*0.75)+'</span><span>'+fmtShort(maxV*0.5)+'</span><span>'+fmtShort(maxV*0.25)+'</span><span>$0</span></div>'+
  '<div class="chart-area" title="Hover over a dot to see the exact amount for that day"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs>'+
  '<linearGradient id="mintFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45cbb5" stop-opacity=".28"/><stop offset="1" stop-color="#45cbb5" stop-opacity="0"/></linearGradient>'+
  '<linearGradient id="pinkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4f96" stop-opacity=".2"/><stop offset="1" stop-color="#ff4f96" stop-opacity="0"/></linearGradient></defs>'+
  '<polygon points="'+incArea+'" fill="url(#mintFill)"/><polygon points="'+expArea+'" fill="url(#pinkFill)"/>'+
  '<polyline points="'+incPts+'" fill="none" stroke="#45cbb5" stroke-width="3"/><polyline points="'+expPts+'" fill="none" stroke="#ff4f96" stroke-width="3"/>'+
  dots(incC,'#45cbb5')+dots(expC,'#ff4f96')+
  '</svg></div>'+
  '<div class="x-labels" style="position:absolute">'+xLabelsHtml+'</div></div>';
}
function buildDonut(spend, totalCat, exp){
  const R=80, CX=100, CY=100, SW=24;
  const circumference = 2*Math.PI*R;
  let cum=0; let segs=''; let rows='';
  const allCats = allCategoryNames();
  const activeCats = allCats.filter(function(name){ return (spend[name]||0)>0; });
  if(!activeCats.length){
    segs = '<circle class="donut-empty-track" cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="#f0e9ee" stroke-width="'+SW+'"><title>No expenses recorded yet</title></circle>';
  } else {
    activeCats.forEach(function(name){
      const val=spend[name]||0; const pct = totalCat? (val/totalCat*100):0;
      const segLen = (pct/100)*circumference;
      const gap = Math.max(circumference-segLen, 0);
      const offset = -1*(cum/100)*circumference;
      cum += pct;
      segs += '<circle class="donut-seg" onclick="filterTransactionsByCategory(\''+name+'\')" cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+catMeta(name).color+'" stroke-width="'+SW+'" stroke-linecap="round" stroke-dasharray="'+segLen.toFixed(1)+' '+gap.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'"><title>'+name+': '+fmt(val)+' ('+pct.toFixed(0)+'%) \u2014 click to view these transactions</title></circle>';
    });
  }
  allCats.forEach(function(name){
    const val=spend[name]||0; const pct = totalCat? (val/totalCat*100):0;
    if(val<=0) return;
    rows += '<div class="legend-row clickable-row" onclick="filterTransactionsByCategory(\''+name+'\')" title="'+name+': '+fmt(val)+' ('+pct.toFixed(0)+'% of spending) \u2014 click to view these transactions"><i style="background:'+catMeta(name).color+'"></i><span>'+name+'</span><div class="legend-amt"><b>'+pct.toFixed(0)+'%</b><span>'+fmt(val)+'</span></div></div>';
  });
  if(!rows) rows = emptyState('No expenses recorded yet');
  return '<div class="donut-wrap"><div class="donut-chart"><svg viewBox="0 0 200 200">'+segs+'</svg><div class="donut-center">Total Spent<b>'+fmt(exp)+'</b></div></div><div class="legend">'+rows+'</div></div>';
}
function dotsForDate(iso){
  const arr=[]; let hasInc=false, hasExp=false;
  state.transactions.forEach(function(t){ if(t.date===iso){ if(t.type==='income') hasInc=true; else hasExp=true; } });
  if(hasInc) arr.push('#45cbb5');
  if(hasExp) arr.push('#ff4f96');
  if(state.bills.some(function(b){ return b.dueDate===iso; })) arr.push('#ffb325');
  if(state.savingsGoals.some(function(g){ return g.contributions.some(function(c){ return c.date===iso; }); })) arr.push('#9a65e8');
  if(!arr.length) return '';
  return '<div class="day-dots">'+arr.slice(0,4).map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</div>';
}
function dayTooltip(iso){
  const parts=[];
  const incCount = state.transactions.filter(function(t){return t.date===iso && t.type==='income';}).length;
  const expCount = state.transactions.filter(function(t){return t.date===iso && t.type==='expense';}).length;
  const billCount = state.bills.filter(function(b){return b.dueDate===iso;}).length;
  const savCount = state.savingsGoals.reduce(function(s,g){return s+g.contributions.filter(function(c){return c.date===iso;}).length;},0);
  if(incCount) parts.push(incCount+' income');
  if(expCount) parts.push(expCount+' expense'+(expCount>1?'s':''));
  if(billCount) parts.push(billCount+' bill'+(billCount>1?'s':'')+' due');
  if(savCount) parts.push(savCount+' savings contribution'+(savCount>1?'s':''));
  return parts.length? fmtDateShort(iso)+': '+parts.join(', ') : fmtDateShort(iso)+': click to add a transaction';
}
function calendarPanel(compact){
  const y = calView.y;

  const cells=[];
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i, inMonth:false});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, inMonth:true});
  while(cells.length<42) cells.push({day:cells.length-(startDow+daysInMonth)+1, inMonth:false});

function footerCardsHTML(){
  const budget = state.settings.monthlyBudget||1; const spent = totalExpense(); const remaining = budget-spent;
  const spentPct = Math.min(100, Math.max(0, Math.round((spent/budget)*100)));
  const truePct = Math.max(0, Math.round((spent/budget)*100));
  let msg, sub;
  if(remaining<0){
    msg = "You've exceeded your budget";
    sub = "You're "+fmt(Math.abs(remaining))+" over your "+fmt(budget)+' target \u2014 '+truePct+'% spent so far.';
  } else if(spent===0){
    msg = "Ready when you are! \ud83d\udc4b";
    sub = "No expenses logged yet this month \u2014 your full "+fmt(budget)+' budget is available.';
  } else if(spentPct<50){
    msg = "You're doing great! \ud83c\udf89";
    sub = "Only "+spentPct+'% of your budget used \u2014 '+fmt(remaining)+' still available to spend.';

function importBackup(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.transactions||!parsed.settings) throw new Error('invalid');
      state=parsed; if(typeof state.settings.tipIndex!=='number') state.settings.tipIndex=Math.floor(Math.random()*20); saveState(); toast('Backup restored'); updateHeaderGreeting(); renderTipCard(); renderDemoBadge(); applyAccentTheme(); applyFontChoice(); navigate('dashboard');
    }catch(err){ toast('Invalid backup file','error'); }
  };
  reader.readAsText(file);
}

/* ---------- navigation & init ---------- */
function currentView(){ const b=document.querySelector('.nav button.active'); return b? b.dataset.view : 'dashboard'; }
function render(view){
  const root=document.getElementById('viewRoot');
  if(view==='dashboard') root.innerHTML=viewDashboard();
  else if(view==='transactions') root.innerHTML=viewTransactions();
  else if(view==='calendar') root.innerHTML=viewCalendar();
  else if(view==='bills') root.innerHTML=viewBills();
  else if(view==='budget') root.innerHTML=viewBudget();
  else if(view==='savings') root.innerHTML=viewSavings();
  else if(view==='debt') root.innerHTML=viewDebt();
  else if(view==='reports') root.innerHTML=viewReports();
  else if(view==='yearly') root.innerHTML=viewYearly();
  else if(view==='goals') root.innerHTML=viewGoals();
  else if(view==='settings') root.innerHTML=viewSettings();
  else if(view==='backup') root.innerHTML=viewBackup();
  else if(view==='help') root.innerHTML=viewHelp();
}
let historyDepth = 0;
function navigate(view, opts){
  opts = opts || {};
  closeModal();
  const notif = document.getElementById('notifDropdown'); if(notif) notif.style.display='none';
  const more = document.getElementById('moreMenu'); if(more) more.style.display='none';
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('active', b.dataset.view===view); });
  if(view==='dashboard'){ calView.y=new Date().getFullYear(); calView.m=new Date().getMonth(); }
  render(view);
  if(innerWidth<850) closeSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
  if(!opts.fromHistory){
    historyDepth++;
    try{ history.pushState({view:view, depth:historyDepth}, '', '#'+view); }catch(e){}
  } else if(typeof opts.depth==='number'){
    historyDepth = opts.depth;
  }
  updateBackButtonState();
}
function updateBackButtonState(){
  const btn = document.getElementById('backBtn');
  if(btn) btn.disabled = historyDepth<=0;
}
function goBack(){ history.back(); }
function openSidebar(){ if(innerWidth>=850) return; document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('show'); }
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  if(sb.classList.contains('open')) closeSidebar(); else openSidebar();
}
window.addEventListener('popstate', function(e){
  const view = (e.state && e.state.view) || 'dashboard';
  const depth = (e.state && typeof e.state.depth==='number')? e.state.depth : 0;
  navigate(view, {fromHistory:true, depth:depth});
});
function navigateMonth(delta){
  calView.m += delta;
  if(calView.m<0){ calView.m=11; calView.y--; }
  if(calView.m>11){ calView.m=0; calView.y++; }
  render(currentView());
}
function showDayDetails(iso){
  const txs = state.transactions.filter(function(t){return t.date===iso;});
  const bills = state.bills.filter(function(b){return b.dueDate===iso;});
  let html = '<h3 style="margin:0 0 16px">'+fmtDateShort(iso)+'</h3>';
  if(!txs.length && !bills.length) html += '<p style="font-size:13px;color:var(--muted)">Nothing recorded for this day.</p>';
  if(txs.length) html += '<div style="margin-bottom:14px">'+txTable(txs,false)+'</div>';
  if(bills.length) html += bills.map(billRow).join('');
  html += '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Close</button><button class="btn-primary" onclick="closeModal();openTxModal(null,\''+iso+'\')">Add Transaction</button></div>';
  openModal(html);
}

/* ---------- inline calculator ---------- */
let calcTarget = null;
let calcState = {display:'0', prev:null, op:null, waitingForOperand:false};
function roundClean(n){ return Math.round((n+Number.EPSILON)*100000000)/100000000; }
function openCalculator(targetId){
  calcTarget = targetId;
  const input = document.getElementById(targetId);
  const existing = input ? parseFloat(input.value) : NaN;
  calcState = {display: (!isNaN(existing) && existing!==0) ? String(existing) : '0', prev:null, op:null, waitingForOperand:true};
  document.getElementById('calcBox').innerHTML = calculatorHTML();
  document.getElementById('calcOverlay').style.display = 'grid';
}
function closeCalculator(){ document.getElementById('calcOverlay').style.display = 'none'; calcTarget=null; }
function calcKey(label, action, cls, opAttr){ return '<button type="button" class="calc-key'+(cls?' '+cls:'')+'" data-op="'+(opAttr||'')+'" onclick="'+action+'">'+label+'</button>'; }
function calculatorHTML(){
  const grid =
    calcKey('C','calcClear()','calc-fn')+calcKey(iconSvg('i-backspace'),'calcBackspace()','calc-fn')+calcKey('%','calcPercent()','calc-fn')+calcKey('\u00f7',"calcPressOp('\u00f7')",'calc-op','\u00f7')+
    calcKey('7',"calcPressDigit('7')")+calcKey('8',"calcPressDigit('8')")+calcKey('9',"calcPressDigit('9')")+calcKey('\u00d7',"calcPressOp('\u00d7')",'calc-op','\u00d7')+
    calcKey('4',"calcPressDigit('4')")+calcKey('5',"calcPressDigit('5')")+calcKey('6',"calcPressDigit('6')")+calcKey('\u2212',"calcPressOp('\u2212')",'calc-op','\u2212')+
    calcKey('1',"calcPressDigit('1')")+calcKey('2',"calcPressDigit('2')")+calcKey('3',"calcPressDigit('3')")+calcKey('+',"calcPressOp('+')",'calc-op','+')+
    calcKey('0',"calcPressDigit('0')",'calc-zero')+calcKey('.','calcPressDecimal()')+calcKey('=','calcEquals()','calc-equals');
  return '<div class="info-modal-title"><div class="bill-icon" style="background:var(--pink-tint);color:var(--pink-dark)">'+iconSvg('i-calc')+'</div><h3>Calculator</h3></div>'+
  '<div class="calc-display" id="calcDisplay">'+esc(calcState.display)+'</div>'+
  '<div class="calc-grid">'+grid+'</div>'+
  '<button type="button" class="btn-primary calc-use-btn" id="calcUseBtn" onclick="calcUseValue()">Use This Value \u2014 '+esc(state.settings.currency||'$')+esc(calcState.display)+'</button>'+
  '<button type="button" class="btn-secondary" style="width:100%;margin-top:8px" onclick="closeCalculator()">Cancel</button>';
}
function calcCompute(a,op,b){
  a=parseFloat(a); b=parseFloat(b);
  if(op==='+') return a+b;
  if(op==='\u2212') return a-b;
  if(op==='\u00d7') return a*b;
  if(op==='\u00f7') return b===0? a : a/b;
  return b;
}
function updateCalcDisplay(){
  const el=document.getElementById('calcDisplay'); if(el) el.textContent = calcState.display;
  const btn=document.getElementById('calcUseBtn'); if(btn) btn.textContent = 'Use This Value \u2014 '+(state.settings.currency||'$')+calcState.display;
}
function updateActiveOpKey(){
  document.querySelectorAll('.calc-key.calc-op').forEach(function(btn){
    btn.classList.toggle('active', calcState.op!==null && btn.dataset.op===calcState.op);
  });
}
function calcPressDigit(d){
  if(calcState.display.length>=12 && !calcState.waitingForOperand) return;
  if(calcState.waitingForOperand){ calcState.display = d; calcState.waitingForOperand=false; }
  else { calcState.display = calcState.display==='0'? d : calcState.display+d; }
  updateCalcDisplay();
}
function calcPressDecimal(){
  if(calcState.waitingForOperand){ calcState.display='0.'; calcState.waitingForOperand=false; updateCalcDisplay(); return; }
  if(calcState.display.indexOf('.')===-1) calcState.display+='.';
  updateCalcDisplay();
}
function calcPressOp(op){
  const val = parseFloat(calcState.display);
  if(calcState.prev!==null && calcState.op && !calcState.waitingForOperand){
    calcState.display = String(roundClean(calcCompute(calcState.prev, calcState.op, val)));
    calcState.prev = parseFloat(calcState.display);
  } else {
    calcState.prev = val;
  }
  calcState.op = op;
  calcState.waitingForOperand = true;
  updateCalcDisplay();
  updateActiveOpKey();
}
function calcEquals(){
  if(calcState.op===null || calcState.prev===null) return;
  const val = parseFloat(calcState.display);
  calcState.display = String(roundClean(calcCompute(calcState.prev, calcState.op, val)));
  calcState.prev = null; calcState.op = null; calcState.waitingForOperand = true;
  updateCalcDisplay();
  updateActiveOpKey();
}
function calcClear(){ calcState={display:'0',prev:null,op:null,waitingForOperand:false}; updateCalcDisplay(); updateActiveOpKey(); }
function calcBackspace(){
  if(calcState.waitingForOperand) return;
  calcState.display = calcState.display.length>1? calcState.display.slice(0,-1) : '0';
  if(calcState.display==='-') calcState.display='0';
  updateCalcDisplay();
}
function calcPercent(){
  const val = parseFloat(calcState.display);
  calcState.display = String(roundClean(val/100));
  updateCalcDisplay();
}
function calcUseValue(){
  if(calcState.op!==null && calcState.prev!==null && !calcState.waitingForOperand) calcEquals();
  const input = calcTarget? document.getElementById(calcTarget) : null;
  if(input){
    let val = Math.abs(roundClean(parseFloat(calcState.display)||0));
    input.value = val;
    input.dispatchEvent(new Event('input', {bubbles:true}));
  }
  closeCalculator();
}
function openModal(html){
  const notif = document.getElementById('notifDropdown'); if(notif) notif.style.display='none';
  const more = document.getElementById('moreMenu'); if(more) more.style.display='none';
  document.getElementById('modalBox').innerHTML=html; document.getElementById('modalOverlay').style.display='grid';
}

const HELP_TOPICS = {
  gettingStartedInfo:{icon:'i-wallet', color:'#ff4f96', title:'Getting Started', text:'BudgetFlow Pro lives entirely inside this one file \u2014 nothing to install, no account, no subscription. The first time you open it, a short welcome screen asks for your name, currency, and a monthly budget target; after that you land straight on your Dashboard. The sample data you see at first is just a demo \u2014 edit or delete it any time and replace it with your own.'},
  dataPrivacyInfo:{icon:'i-help', color:'#4d9af5', title:'Your Data Stays On This Device', text:'Everything you enter is saved privately inside this web browser, on the device you are using right now. Nothing is uploaded to the internet and no one else can see it. This also means it will not automatically appear if you open the file on a different phone, tablet, or computer \u2014 always use the same browser and device, and see \u201cBackup & Restore\u201d below for how to move your data anywhere else.'},
  installAppInfo:{icon:'i-download', color:'#12ad8e', title:'Using It Like An App', text:'BudgetFlow Pro is a single file that opens straight in your browser \u2014 nothing to install, and it works fully offline once loaded. That part is guaranteed on every device. Some browsers also offer a way to add a shortcut for quicker access: on a computer, Chrome or Edge sometimes shows an install icon in the address bar; on a phone, look in the browser\u2019s menu for something like \u201cAdd to Home screen.\u201d Availability varies by device and browser version, so if you don\u2019t see it, that\u2019s completely fine \u2014 simply keep opening the file in your browser as usual, it works exactly the same either way.'},
  undoRedoInfo:{icon:'i-undo', color:'#9a65e8', title:'Undo & Redo', text:'Made a mistake, or changed your mind? The undo and redo arrows at the top of every page step you back and forward through your recent changes \u2014 add a transaction, delete a bill, edit your budget, and undo it instantly if you need to. They\u2019re greyed out when there\u2019s nothing to undo or redo yet.'},
  dashboardCards:{icon:'i-wallet', color:'#ff4f96', title:'Your Summary Cards', img:'dashboard_cards', text:'These five cards summarize whichever month you are viewing. Every card is clickable: tap Total Income or Total Expenses to see just those transactions, tap Savings to jump to your goals, or tap Bills Due to go straight to your bills list.'},
  incomeExpensesChart:{icon:'i-chart', color:'#45cbb5', title:'Income vs Expenses', img:'income_expenses_chart', text:'This chart plots your daily income (mint) against your daily expenses (pink). Use the Today, 7D, 30D, or 90D buttons above it to change the range, and hover any dot to see the exact amount logged that day.'},
  expensesByCategory:{icon:'i-pie', color:'#9a65e8', title:'Expenses by Category', img:'expenses_by_category', text:'A ring chart showing where your money went this month, category by category. Click any slice of the ring, or any row in the list beside it, to see exactly which transactions make up that category.'},
  upcomingBills:{icon:'i-receipt', color:'#ffb325', title:'Upcoming Bills', img:'upcoming_bills', text:'Your next unpaid bills, soonest due date first. Click any bill here to open it and either edit the details or mark it as paid on the spot.'},
  recentTransactions:{icon:'i-transactions', color:'#4d9af5', title:'Recent Transactions', img:'recent_transactions', text:'The latest income and expenses logged for the month you are viewing. Click any row to edit that transaction immediately, without needing to search for it first.'},
  budgetProgressPanel:{icon:'i-pie', color:'#9a65e8', title:'Budget Progress', img:'budget_progress', text:'Shows how much of each category\u2019s monthly limit you have used so far. A bar turns red once you go over. Click any row to open and adjust that category\u2019s budget.'},
  calendarDots:{icon:'i-calendar', color:'#45cbb5', title:'Reading the Calendar', img:'calendar_view', text:'Small dots mark activity on a day: mint for income, pink for an expense, orange for a bill due, and purple for a savings contribution. Click any day to see everything that happened on it and quickly add something new dated for that day.'},
  transactionsSearch:{icon:'i-search', color:'#4d9af5', title:'Search & Filter', img:'transactions_search', text:'Type in the search box to find a transaction by its description or category \u2014 the matching part of the text is highlighted right in the results so you can see exactly why each one matched. Use the two dropdowns to narrow the list to just income or expenses, or to a single category \u2014 the list updates instantly as you type or choose.'},
  calculatorInfo:{icon:'i-calc', color:'#ff4f96', title:'Built-In Calculator', text:'Every amount field \u2014 transactions, bills, budgets, savings, debts, goals \u2014 has a small calculator icon next to it. Tap it to split a bill, add up a receipt, or work out a percentage without ever leaving the app or switching to another calculator, then tap \u201cUse This Value\u201d to drop the result straight into the field.'},
  billsStatus:{icon:'i-receipt', color:'#ffb325', title:'Bill Status & Recurring Bills', img:'bills_status', text:'Upcoming, Due Soon, Overdue, and Paid are worked out automatically from the due date. Turn on \u201cRepeats monthly\u201d when adding a bill and, the moment you mark it paid, BudgetFlow Pro creates next month\u2019s bill for you automatically.'},
  budgetCategories:{icon:'i-pie', color:'#9a65e8', title:'Budgets & Custom Categories', img:'budget_icon_picker', text:'Give any category a monthly limit. Choosing \u201c+ Add New Category\u201d lets you type your own category name and pick from 18 icons and colours, which then becomes available for transactions and bills too. You can also create a category on the fly while adding a transaction or bill \u2014 just choose \u201cOther\u201d and a field appears so you can name exactly what it is.'},
  savingsGoalsInfo:{icon:'i-piggy', color:'#f0a500', title:'Savings Goals', img:'savings_goals', text:'Create a goal with a target amount, then log a contribution any time you set money aside. Your progress bar updates instantly, and the amount counts toward that month\u2019s Savings card on the Dashboard.'},
  financialGoalsInfo:{icon:'i-target', color:'#4d9af5', title:'Financial Goals', img:'financial_goals', text:'Set a target amount and a deadline for anything you are working toward \u2014 a trip, a purchase, an emergency fund. Log progress any time, and BudgetFlow Pro shows you how many days are left until your deadline.'},
  debtTrackerInfo:{icon:'i-debt', color:'#8449d8', title:'Debt Tracker', img:'debt_tracker', text:'List each debt with its balance, interest rate, and minimum payment. Logging a payment automatically reduces the balance shown and records the payment as an expense for you.'},
  reportsInfo:{icon:'i-chart', color:'#4d9af5', title:'Reports', img:'reports_view', text:'A complete breakdown of whichever month you select: category spending, the income and expense trend, and a written summary. Use \u201cExport as CSV\u201d to download that month\u2019s transactions as a spreadsheet file.'},
  rolloverInfo:{icon:'i-wallet', color:'#9a65e8', title:'Rollover', text:'Rollover lets you carry money left over (or overspent) from last month into this month\u2019s numbers. Edit it any time in the Summary card on the Reports page \u2014 if last month ended with a leftover, you\u2019ll see a one-tap suggestion to use that exact amount. It\u2019s added to your income when calculating \u201cAvailable This Month\u201d and the Dashboard\u2019s Remaining Balance. Leave it at $0 if you don\u2019t want to carry anything over.'},
  yearlyInfo:{icon:'i-calendar', color:'#45cbb5', title:'Yearly Overview', text:'See your whole year at a glance: total income, expenses, and net savings, a 12-month bar chart you can tap for exact figures, category spending for the full year, and automatic insights like your best income month and highest spending month. Use the arrows to browse any year.'},
  calcYearIncome:{icon:'i-wallet', color:'#45cbb5', title:'How This Is Calculated', text:'This adds up every transaction marked as Income with a date inside the selected year \u2014 January 1st through December 31st. It updates instantly whenever you add, edit, or delete a transaction.'},

function copyEmailAddress(e){
  e.preventDefault(); e.stopPropagation();
  const email = 'plalindastudio@gmail.com';
  const btn = e.currentTarget;
  function showCopied(){
    toast('Email address copied!');
    const original = btn.innerHTML;
    btn.innerHTML = iconSvg('i-check');
    btn.classList.add('copied');
    setTimeout(function(){ btn.innerHTML = original; btn.classList.remove('copied'); }, 1500);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(email).then(showCopied).catch(function(){ fallbackCopy(email, showCopied); });
  } else { fallbackCopy(email, showCopied); }
}
function fallbackCopy(text, onDone){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); onDone(); }catch(e){ toast('Could not copy \u2014 email is plalindastudio@gmail.com','error'); }
  document.body.removeChild(ta);
}
function toast(msg, type){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast'+(type==='error'?' toast-error':''); el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.classList.add('show'); },10);
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },300); },2500);
}

function saveTx(id){
  const type=document.getElementById('mTxType').value;
  const desc=document.getElementById('mTxDesc').value.trim();
  const amtRaw=parseFloat(document.getElementById('mTxAmount').value);
  let category=document.getElementById('mTxCategory').value;
  const date=document.getElementById('mTxDate').value;
  if(category==='__new__' || category==='Other'){
    const newCat = document.getElementById('mTxCategoryNew').value.trim();
    if(category==='__new__' && !newCat){ toast('Please enter a category name','error'); return; }
    if(newCat){
      category = newCat;
      if(!CATS[category] && !(state.customCategories && state.customCategories[category])){
        state.customCategories = state.customCategories||{};
        const p = ICON_PALETTE[Object.keys(state.customCategories).length % ICON_PALETTE.length];
        state.customCategories[category] = {icon:p.icon, color:p.color};
      }
    } else { category = 'Other'; }
  }
  if(!desc || isNaN(amtRaw) || amtRaw<=0 || !date){ toast('Please fill all fields correctly','error'); return; }
  if(!id && demoLimitReached()){ closeModal(); requireActivationTrialEnded(); return; }
  const amount = type==='income'? Math.abs(amtRaw) : -Math.abs(amtRaw);
  if(id){ const t=state.transactions.find(function(x){return x.id===id;}); Object.assign(t,{type:type,desc:desc,amount:amount,category:category,date:date}); }
  else { state.transactions.push({id:uid(), type:type, desc:desc, amount:amount, category:category, date:date}); useDemoCredit(); }
  saveState(); closeModal(); toast(id?'Transaction updated':'Transaction added'); render(currentView());
}

function addOneMonth(iso){
  const parts=iso.split('-').map(Number); const y=parts[0], m=parts[1], d=parts[2];
  let ny=y, nm=m+1; if(nm>12){ nm=1; ny++; }
  const daysInNextMonth=new Date(ny,nm,0).getDate();
  return ny+'-'+pad2(nm)+'-'+pad2(Math.min(d,daysInNextMonth));
}
function toggleBillPaid(id){
  const b=state.bills.find(function(x){return x.id===id;}); b.paid=!b.paid;
  if(b.paid){
    state.transactions.push({id:uid(), date:todayISO(), desc:b.name+' (Bill)', category:b.category, amount:-Math.abs(b.amount), type:'expense'});
    if(b.recurring){
      const nextDue = addOneMonth(b.dueDate);
      const alreadyExists = state.bills.some(function(x){ return x.name===b.name && x.dueDate===nextDue; });
      if(!alreadyExists){ state.bills.push({id:uid(), name:b.name, category:b.category, amount:b.amount, dueDate:nextDue, paid:false, recurring:true}); }
    }
  }
  saveState(); toast(b.paid?'Marked as paid':'Marked as unpaid'); render(currentView());
}

  const sel = document.getElementById('mBudgetCat').value;

  if(isNewBudget) useDemoCredit();

function openGoalModal(id){
  const editing=!!id;
  const g = editing? state.goals.find(function(x){return x.id===id;}) : {name:'',target:'',deadline:daysFromNow(90)};
  const html='<h3 style="margin:0 0 16px">'+(editing?'Edit':'Add')+' Goal</h3>'+
  '<div class="field"><label>Goal Name</label><input id="mGoalName" type="text" value="'+esc(g.name)+'" placeholder="e.g. Vacation"/></div>'+
  amountField('Target Amount', 'mGoalTarget', g.target, '0.01')+
  '<div class="field"><label>Deadline</label><input id="mGoalDeadline" type="date" value="'+g.deadline+'"/></div>'+
  '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveGoal(\''+(editing?id:'')+'\')">Save</button></div>';
  openModal(html);
}
function saveGoal(id){
  const name=document.getElementById('mGoalName').value.trim();
  const target=parseFloat(document.getElementById('mGoalTarget').value);
  const deadline=document.getElementById('mGoalDeadline').value;
  if(!name || isNaN(target) || target<=0 || !deadline){ toast('Please fill all fields correctly','error'); return; }
  if(!id && demoLimitReached()){ closeModal(); requireActivationTrialEnded(); return; }
  if(id){ Object.assign(state.goals.find(function(x){return x.id===id;}),{name:name,target:target,deadline:deadline}); }
  else { state.goals.push({id:uid(), name:name, target:target, current:0, deadline:deadline}); useDemoCredit(); }
  saveState(); closeModal(); toast('Goal saved'); render('goals');
}
function deleteGoal(id){ askConfirm('Delete this goal?', function(){ state.goals=state.goals.filter(function(g){return g.id!==id;}); saveState(); toast('Goal deleted'); render('goals'); }); }
function openGoalContribModal(id){
  const html='<h3 style="margin:0 0 16px">Add Progress</h3><div class="field"><label>Amount</label><input id="mGoalContrib" type="number" step="0.01" min="0.01" placeholder="0.00"/></div>'+
  '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveGoalContrib(\''+id+'\')">Add</button></div>';
  openModal(html);
}
function saveGoalContrib(id){
  const amount=parseFloat(document.getElementById('mGoalContrib').value);
  if(isNaN(amount) || amount<=0){ toast('Enter a valid amount','error'); return; }
  const g=state.goals.find(function(x){return x.id===id;}); g.current=Math.min(g.target, g.current+amount);
  saveState(); closeModal(); toast('Progress updated'); render('goals');
}

/* ---------- settings ---------- */
function saveSettings(){
  state.settings.name = document.getElementById('setName').value.trim() || 'Friend';
  state.settings.currency = document.getElementById('setCurrency').value.trim() || '$';
  state.settings.monthlyBudget = parseFloat(document.getElementById('setBudget').value) || 0;
  saveState(); toast('Settings saved'); updateHeaderGreeting(); render('settings');
}
function resetAllData(){
  askConfirm('This will erase everything and restore demo data. Continue?', function(){
    state = seedState(); saveState(); toast('Data reset'); updateHeaderGreeting(); renderTipCard(); renderDemoBadge(); navigate('dashboard');

}

function isValidActivationCode(raw){
  const code = (raw||'').trim().toUpperCase();
  const m = code.match(/^BFP-(\d{4})-(\d{4})$/);
  if(!m) return false;
  const a = parseInt(m[1],10);
  const expected = (a*7+13)%10000;
  return parseInt(m[2],10) === expected;
}
function activateCode(){
  const input = document.getElementById('activationInput');
  const val = input ? input.value : '';
  if(isValidActivationCode(val)){
    state.settings.activated = true;
    saveState();
    toast('\ud83c\udf89 Full version unlocked \u2014 thank you!');
    renderDemoBadge();
    render('settings');
  } else {
    toast('That code is not valid. Double-check and try again.','error');
  }
}
function demoCreditsUsed(){ return state.settings.demoCreditsUsed||0; }
function demoLimitReached(){ return !state.settings.activated && demoCreditsUsed()>=DEMO_TX_LIMIT; }
function useDemoCredit(){ if(!state.settings.activated){ state.settings.demoCreditsUsed = demoCreditsUsed()+1; } }

function applyAccentTheme(){
  const id = state.settings.accentTheme||'blossom';
  ACCENT_THEMES.forEach(function(t){ document.body.classList.remove('theme-'+t.id); });
  document.body.classList.add('theme-'+id);
}
function applyFontChoice(){
  const id = state.settings.fontChoice||'modern';
  FONT_CHOICES.forEach(function(f){ document.body.classList.remove('font-'+f.id); });
  document.body.classList.add('font-'+id);
}
function setAccentTheme(id){
  if(id!=='blossom' && !state.settings.activated){ requireActivation('Color themes'); return; }
  state.settings.accentTheme=id; applyAccentTheme(); saveState(); render('settings'); toast('Theme updated');
}
function setFontChoice(id){
  if(id!=='modern' && !state.settings.activated){ requireActivation('Custom fonts'); return; }
  state.settings.fontChoice=id; applyFontChoice(); saveState(); render('settings'); toast('Font updated');
}
function themeSwatchesHTML(){
  const current = state.settings.accentTheme||'blossom';
  return ACCENT_THEMES.map(function(t){
    const active = t.id===current;
    const locked = t.id!=='blossom' && !state.settings.activated;
    return '<button type="button" class="theme-swatch'+(active?' active':'')+'" onclick="setAccentTheme(\''+t.id+'\')" title="'+t.name+(locked?' \u2014 available in the full version':'')+'" style="background:linear-gradient(135deg,'+t.p1+','+t.p2+')">'+(active?iconSvg('i-check'):(locked?'<span class="lock-badge">'+iconSvg('i-lock')+'</span>':''))+'</button>';
  }).join('');
}
function fontOptionsHTML(){
  const current = state.settings.fontChoice||'modern';
  return FONT_CHOICES.map(function(f){
    const active = f.id===current;
    const locked = f.id!=='modern' && !state.settings.activated;
    return '<button type="button" class="font-option'+(active?' active':'')+'" onclick="setFontChoice(\''+f.id+'\')" style="font-family:'+f.family+'"><span class="font-sample">Aa</span><span class="font-name">'+f.name+(locked?' '+iconSvg('i-lock'):'')+'</span></button>';
  }).join('');
}
function buildNotifList(){
  const items = state.bills.filter(function(b){ return !b.paid && daysBetween(todayISO(), b.dueDate)<=7; }).sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
  if(!items.length) return '<div class="notif-empty">No urgent notifications \ud83c\udf89</div>';
  return items.map(function(b){
    const days = daysBetween(todayISO(), b.dueDate); const overdue = days<0;
    return '<div class="notif-item"><b>'+esc(b.name)+'</b><span>'+(overdue?'Overdue':'Due in '+days+'d')+' \u00b7 '+fmt(b.amount)+'</span></div>';
  }).join('');
}
function toggleNotif(e){
  e.stopPropagation();
  const dd=document.getElementById('notifDropdown');
  const more=document.getElementById('moreMenu'); if(more) more.style.display='none';
  if(dd.style.display==='none'||!dd.style.display){
    dd.innerHTML=buildNotifList();
    const r = e.currentTarget.getBoundingClientRect();
    const appR = document.querySelector('.app').getBoundingClientRect();
    const ddWidth = Math.min(250, appR.width-24);
    let left = r.right - ddWidth;
    left = Math.max(appR.left+12, Math.min(left, appR.right - ddWidth - 12));
    dd.style.left = left+'px';
    dd.style.right = 'auto';
    dd.style.top = (r.bottom+8)+'px';
    dd.style.width = ddWidth+'px';
    dd.style.display = 'block';
  }
  else dd.style.display='none';
}
function buildMoreMenu(){

    {icon:'i-chart', color:'#4d9af5', label:'Reports', action:"navigate('reports')"},

    '<button class="more-item-half"'+(redoDisabled?' disabled':'')+' onclick="closeMoreMenu();redoAction()">'+iconSvg('i-redo')+' Redo</button>'+
    '</div>';
  return mobileUndoRedo+'<div class="more-header">Quick Access</div>'+items.map(function(it){

function toggleMoreMenu(e){
  e.stopPropagation();
  const dd=document.getElementById('moreMenu');

    dd.style.left = left+'px';

    dd.style.width = ddWidth+'px';

function closeMoreMenu(){ document.getElementById('moreMenu').style.display='none'; }
document.addEventListener('click', function(e){
  const dd=document.getElementById('notifDropdown');
  if(dd && dd.style.display==='block' && !e.target.closest('.notif-wrap') && !e.target.closest('#notifDropdown')) dd.style.display='none';

  if(more && more.style.display==='block' && !e.target.closest('.more-wrap') && !e.target.closest('#moreMenu')) more.style.display='none';
});

/* ---------- onboarding (first run only) ---------- */
function openOnboardingModal(){
  const html = '<h3 style="margin:0 0 6px">Welcome to BudgetFlow Pro! \ud83d\udc4b</h3>'+
  '<p style="font-size:13px;color:var(--muted);margin:0 0 18px">Let\'s personalize your dashboard. You can always change these later in Settings.</p>'+
  '<div class="field"><label>Your Name</label><input id="obName" type="text" placeholder="e.g. Sarah" autofocus/></div>'+
  '<div class="field"><label>Currency Symbol</label><input id="obCurrency" type="text" maxlength="3" value="$"/></div>'+
  '<div class="field"><label>Monthly Budget Target</label><input id="obBudget" type="number" step="0.01" value="3500"/></div>'+
  '<div class="modal-actions"><button class="btn-primary" onclick="saveOnboarding()" style="width:100%;justify-content:center">Get Started</button></div>';
  openModal(html);
  document.getElementById('modalOverlay').setAttribute('data-onboarding','1');
}
function saveOnboarding(){
  const name = document.getElementById('obName').value.trim() || 'Friend';
  const currency = document.getElementById('obCurrency').value.trim() || '$';
  const budget = parseFloat(document.getElementById('obBudget').value) || 3500;
  state.settings.name = name; state.settings.currency = currency; state.settings.monthlyBudget = budget;
  saveState(); closeModal();
  document.getElementById('modalOverlay').removeAttribute('data-onboarding');
  updateHeaderGreeting(); render(currentView());
  toast('Welcome, '+name+'! Your dashboard is ready.');
}

/* ---------- init ---------- */
(function init(){
  if(state.settings.theme==='dark') document.body.classList.add('dark');
  applyAccentTheme();
  applyFontChoice();
  updateHeaderGreeting();
  renderTipCard();
  renderDemoBadge();
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('active', b.dataset.view==='dashboard'); });
  render('dashboard');
  try{ history.replaceState({view:'dashboard', depth:0}, '', '#dashboard'); }catch(e){}
  historyDepth = 0;
  updateBackButtonState();
  if(isFirstRun) openOnboardingModal();
})();
